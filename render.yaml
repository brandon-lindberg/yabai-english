# Render Blueprint for the English Platform.
# Docs: https://render.com/docs/blueprint-spec
#
# This provisions:
#   1. A managed Postgres 18 database.
#   2. A Node web service that runs the Next.js app in apps/web.
#
# Secrets flagged `sync: false` must be set manually in the Render dashboard
# the first time the Blueprint is applied (Render will prompt for them).

databases:
  - name: english-platform-db
    databaseName: english_platform
    user: english_platform
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: "18"
    # An empty list blocks every external connection. It sat here harmlessly
    # until a render.yaml edit made Render re-sync the Blueprint and enforce it,
    # which cut off local access to the database. Entries live here rather than
    # only in the dashboard so a future re-sync restores access instead of
    # removing it.
    ipAllowList:
      - source: 59.138.130.204/32
        description: Brandon local machine

services:
  - type: web
    name: english-platform-web
    runtime: node
    plan: starter
    region: singapore
    rootDir: apps/web
    # yarn postinstall runs `prisma generate`, so no separate generate step needed.
    buildCommand: yarn install --frozen-lockfile --ignore-engines && yarn build
    # Migrations run AFTER a successful build but BEFORE traffic is shifted,
    # so a migration failure won't take the old version down.
    preDeployCommand: yarn prisma migrate deploy
    startCommand: yarn start
    healthCheckPath: /
    autoDeploy: true

    envVars:
      # Node 22 LTS — matches local dev and what Next 16 expects.
      - key: NODE_VERSION
        value: "22"

      # `next build` peaks around 3.3 GB on this codebase (measured), and Node
      # defaults its heap to roughly 2 GB on Render's build machine — which is
      # where the build was dying with "Reached heap limit". Raise the ceiling.
      # If a build still fails after this, look at *how* it fails: a heap-limit
      # message means raise it again, an abrupt kill means the machine itself is
      # too small and the plan needs raising instead.
      - key: NODE_OPTIONS
        value: "--max-old-space-size=4096"

      # Wire the web service to the managed database above.
      - key: DATABASE_URL
        fromDatabase:
          name: english-platform-db
          property: connectionString

      # Auth.js — trust the X-Forwarded-* headers Render sets at the edge.
      - key: AUTH_TRUST_HOST
        value: "true"

      # Render generates a strong random value once and keeps it stable.
      - key: AUTH_SECRET
        generateValue: true

      # --- Manual secrets — Render will prompt for these on first apply ---

      # Google OAuth (from console.cloud.google.com — same client you use locally,
      # but you must add the production redirect URI there too).
      - key: AUTH_GOOGLE_ID
        sync: false
      - key: AUTH_GOOGLE_SECRET
        sync: false

      # 64-char hex string (32 bytes). Generate with:
      #   openssl rand -hex 32
      - key: CALENDAR_TOKEN_ENCRYPTION_KEY
        sync: false

      # Public base URL of the app, e.g. https://english-platform-web.onrender.com
      # (or your custom domain, once attached). No trailing slash.
      - key: NEXT_PUBLIC_APP_URL
        sync: false

      # Stripe Connect. The secret key is sk_test_… or sk_live_… depending on the
      # mode this service should run in; the code accepts either.
      - key: STRIPE_SECRET_KEY
        sync: false

      # Signing secret (whsec_…) for the webhook endpoint at
      # /api/payments/webhooks/stripe. Test and live mode each have their own
      # endpoint and their own secret — use the one matching STRIPE_SECRET_KEY.
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

      # Belt-and-suspenders: make sure the dev-only auth bypass is OFF in prod.
      - key: DEV_AUTH_BYPASS
        value: "false"
